<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>そらのくくランド</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="そら九九">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffe7a8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6dc; --sky:#bfe8ff; --ink:#3b2a1a; --sub:#8a6d4f;
  --card:#ffffff; --line:#f0d9a8;
  --red:#ff6b5b; --orange:#ffa53b; --yellow:#ffd23f; --green:#47c97a; --blue:#4aa8ff; --purple:#a77bff; --pink:#ff7fb6;
  --shadow:0 6px 0 rgba(120,80,30,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:800;
  color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--bg) 42%);
  overflow:hidden;touch-action:manipulation;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;min-height:56px}
.top h2{margin:0;font-size:clamp(22px,5vw,34px);flex:1;text-align:center}
.back{width:56px;height:56px;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:28px}
.back:active,.big:active,.dan:active,.mode:active,.choice:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(120,80,30,.18)}
.starbox{min-width:56px;height:44px;padding:0 12px;border-radius:22px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:4px;font-size:20px}

/* タイトル */
#home .title{text-align:center;margin:6px 0 4px}
#home .title h1{margin:0;font-size:clamp(34px,9vw,60px);letter-spacing:.04em;color:#ff7a3d;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.08)}
#home .title p{margin:2px 0 0;color:var(--sub);font-size:clamp(14px,3.6vw,20px)}
.dangrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.6vw,20px);align-content:center;max-width:min(720px,calc((100vh - 270px) * 1.05));max-width:min(720px,calc((100dvh - 270px) * 1.05));width:100%;margin:0 auto}
.dan{aspect-ratio:1/1;border-radius:28px;box-shadow:var(--shadow);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.dan .n{font-size:clamp(40px,12vw,84px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.dan .l{font-size:clamp(13px,3.4vw,20px);margin-top:2px}
.dan .st{margin-top:2px;min-height:1.2em;font-size:clamp(11px,2.6vw,16px);letter-spacing:-1px;line-height:1.2}
.dan.lock{background:#d9d0c2 !important;color:#fff8}
.dan.lock .n::after{content:"🔒";position:absolute;font-size:28px;top:8px;right:10px}
.homebar{display:flex;gap:12px;justify-content:center;padding-top:10px}
.big{height:64px;padding:0 24px;border-radius:32px;background:#fff;box-shadow:var(--shadow);font-size:clamp(18px,4.6vw,24px);display:flex;align-items:center;gap:8px}

/* だんのメニュー */
.modes{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;max-width:560px;width:100%;margin:0 auto}
.mode{border-radius:28px;padding:18px 22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;text-align:left;color:#fff}
.mode .ic{font-size:clamp(40px,10vw,56px)}
.mode b{display:block;font-size:clamp(24px,6.4vw,34px)}
.mode small{display:block;font-size:clamp(13px,3.4vw,17px);opacity:.92;font-weight:500}
.mode .done{margin-left:auto;font-size:30px}

/* プレイ画面 共通 */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:0}
.eq{background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:clamp(14px,3vw,26px) clamp(20px,5vw,40px);text-align:center;min-width:min(88vw,520px)}
.eq .f{font-size:clamp(46px,14vw,104px);line-height:1.05;white-space:nowrap}
.eq .y{font-size:clamp(20px,5.4vw,34px);color:var(--sub);margin-top:6px;min-height:1.3em}
.eq .q{display:inline-block;min-width:1.2em;color:var(--orange)}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.prog{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.prog i{width:clamp(18px,4.4vw,28px);height:clamp(18px,4.4vw,28px);border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px var(--line);font-style:normal;font-size:clamp(11px,2.8vw,16px);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.prog i.now{background:var(--yellow);box-shadow:none;color:var(--ink)}
.prog i.ok{background:var(--green);box-shadow:none;color:#fff}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;padding-top:6px}
.seg{display:flex;background:#fff;border-radius:30px;box-shadow:var(--shadow);overflow:hidden}
.seg button{height:56px;padding:0 16px;font-size:clamp(16px,4vw,20px);background:#fff}
.seg button.on{background:var(--yellow)}
.wait{height:12px;width:min(70vw,360px);background:#fff;border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.wait div{height:100%;width:0;background:var(--orange);border-radius:6px}
.hint{font-size:clamp(18px,4.8vw,26px);color:var(--sub);min-height:1.4em;text-align:center}

/* どれかな */
.choices{display:flex;gap:clamp(10px,3vw,24px);justify-content:center;width:100%;max-width:720px}
.choice{flex:1;max-width:210px;border-radius:30px;background:#fff;box-shadow:var(--shadow);padding:12px 6px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s}
.choice .face{font-size:clamp(46px,13vw,84px);line-height:1.1}
.choice .num{font-size:clamp(30px,9vw,58px);line-height:1}
.choice.speak{transform:translateY(-10px) scale(1.06);box-shadow:0 0 0 5px var(--yellow),var(--shadow)}
.choice.right{box-shadow:0 0 0 6px var(--green),var(--shadow)}
.choice.wrong{opacity:.35}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ごほうび */
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;font-size:clamp(40px,12vw,80px);text-shadow:0 4px 0 #fff;transition:all .25s;z-index:20;text-align:center;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal{position:fixed;inset:0;background:rgba(60,40,20,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal.on{display:flex}
.card{background:#fff;border-radius:32px;padding:24px;text-align:center;max-width:440px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.12)}
.card .face{font-size:110px;line-height:1.1;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translateY(-12px)}}
.card h3{margin:6px 0;font-size:30px}
.card p{margin:4px 0 16px;color:var(--sub);font-size:18px}
.zukan{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;align-content:start;padding:4px 2px 12px;max-width:820px;width:100%;margin:0 auto}
.zukan div{background:#fff;border-radius:20px;box-shadow:var(--shadow);aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
.zukan div span{font-size:44px;line-height:1.2}
.zukan div.no span{filter:grayscale(1) brightness(1.6);opacity:.35}
.meter{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:10px 16px;text-align:center;margin:6px auto 10px;max-width:520px;width:100%;font-size:18px}
.meter .bar{height:14px;background:#f3ead6;border-radius:7px;overflow:hidden;margin-top:6px}
.meter .bar div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange))}
#tapstart{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(180deg,var(--sky),var(--bg))}
#tapstart h1{margin:0;font-size:clamp(38px,10vw,64px);color:#ff7a3d;text-shadow:3px 3px 0 #fff}
#tapstart .big{height:84px;font-size:32px;padding:0 40px;background:var(--orange);color:#fff}
#tapstart .chars{font-size:clamp(46px,12vw,72px);letter-spacing:8px}
@media (orientation:landscape){.dangrid{max-width:min(720px,calc((100vh - 340px) * 1.1));max-width:min(720px,calc((100dvh - 340px) * 1.1))}#home .title h1{font-size:clamp(30px,6vh,52px)}}
</style>
</head>
<body>
<div id="tapstart">
  <div class="chars">🐣🦖🐙</div>
  <h1>そらの くくランド</h1>
  <button class="big" id="startBtn">▶ はじめる</button>
</div>

<div id="app">
  <!-- ホーム -->
  <section class="screen on" id="home">
    <div class="top">
      <div style="width:56px"></div>
      <div style="flex:1"></div>
      <div class="starbox" id="homeStars">⭐ 0</div>
    </div>
    <div class="title"><h1 id="logo">そらの くくランド</h1><p>どの だんで あそぶ？</p></div>
    <div class="dangrid" id="dangrid"></div>
    <div class="homebar">
      <button class="big" id="toZukan">📖 なかま</button>
    </div>
  </section>

  <!-- だんメニュー -->
  <section class="screen" id="danMenu">
    <div class="top">
      <button class="back" data-go="home">←</button>
      <h2 id="danTitle">2のだん</h2>
      <div class="starbox" id="menuStars">⭐ 0</div>
    </div>
    <div class="modes">
      <button class="mode" data-mode="listen" style="background:var(--blue)"><span class="ic">🎵</span><span><b>きく</b><small>リズムに のって きいてみよう</small></span><span class="done" data-done="listen"></span></button>
      <button class="mode" data-mode="say" style="background:var(--orange)"><span class="ic">📣</span><span><b>こたえて！</b><small>つづきを おおきな こえで いおう</small></span><span class="done" data-done="say"></span></button>
      <button class="mode" data-mode="pick" style="background:var(--green)"><span class="ic">🐾</span><span><b>どれかな？</b><small>ただしい こたえの こを タッチ</small></span><span class="done" data-done="pick"></span></button>
    </div>
  </section>

  <!-- きく -->
  <section class="screen" id="listen">
    <div class="top">
      <button class="back" data-go="danMenu">←</button>
      <h2 class="ttl">きく</h2>
      <div class="starbox stars">⭐ 0</div>
    </div>
    <div class="stage">
      <div class="eq"><div class="f">&nbsp;</div><div class="y">&nbsp;</div></div>
      <div class="prog"></div>
    </div>
    <div class="ctrl">
      <div class="seg" id="speedSeg">
        <button data-sp="0">🐢 ゆっくり</button><button data-sp="1" class="on">🐰 ふつう</button><button data-sp="2">🚀 はやい</button>
      </div>
      <button class="big" id="listenPlay">▶ もういっかい</button>
    </div>
  </section>

  <!-- こたえて -->
  <section class="screen" id="say">
    <div class="top">
      <button class="back" data-go="danMenu">←</button>
      <h2 class="ttl">こたえて！</h2>
      <div class="starbox stars">⭐ 0</div>
    </div>
    <div class="stage">
      <div class="eq"><div class="f">&nbsp;</div><div class="y">&nbsp;</div></div>
      <div class="wait"><div></div></div>
      <div class="hint"></div>
      <div class="prog"></div>
    </div>
    <div class="ctrl">
      <div class="seg" id="orderSeg">
        <button data-ord="0" class="on">1→9 じゅんばん</button><button data-ord="1">🎲 バラバラ</button>
      </div>
    </div>
  </section>

  <!-- どれかな -->
  <section class="screen" id="pick">
    <div class="top">
      <button class="back" data-go="danMenu">←</button>
      <h2 class="ttl">どれかな？</h2>
      <div class="starbox stars">⭐ 0</div>
    </div>
    <div class="stage">
      <div class="eq"><div class="f">&nbsp;</div><div class="y">&nbsp;</div></div>
      <div class="choices"></div>
      <div class="hint"></div>
      <div class="prog"></div>
    </div>
    <div class="ctrl"><button class="big" id="pickReplay">🔊 もういちど きく</button></div>
  </section>

  <!-- なかま図鑑 -->
  <section class="screen" id="zukanScr">
    <div class="top">
      <button class="back" data-go="home">←</button>
      <h2>なかま</h2>
      <div class="starbox stars">⭐ 0</div>
    </div>
    <div class="meter" id="meter"></div>
    <div class="zukan" id="zukan"></div>
  </section>
</div>

<div id="toast"></div>
<div class="modal" id="modal"><div class="card"><div class="face"></div><h3></h3><p></p><button class="big" style="margin:0 auto;background:var(--orange);color:#fff" id="modalOk">やったー！</button></div></div>

<script>
"use strict";
/* ============ データ ============ */
// [だん][かける数-1] = [かけ声, こたえ]（音声ファイルと同じ表）
const KUKU = {
 1:[["いんいちが","いち"],["いんにが","に"],["いんさんが","さん"],["いんしが","し"],["いんごが","ご"],["いんろくが","ろく"],["いんしちが","しち"],["いんはちが","はち"],["いんくが","く"]],
 2:[["にいちが","に"],["ににんが","し"],["にさんが","ろく"],["にしが","はち"],["にご","じゅう"],["にろく","じゅうに"],["にしち","じゅうし"],["にはち","じゅうろく"],["にく","じゅうはち"]],
 3:[["さんいちが","さん"],["さんにが","ろく"],["さざんが","く"],["さんし","じゅうに"],["さんご","じゅうご"],["さぶろく","じゅうはち"],["さんしち","にじゅういち"],["さんぱ","にじゅうし"],["さんく","にじゅうしち"]],
 4:[["しいちが","し"],["しにが","はち"],["しさん","じゅうに"],["しし","じゅうろく"],["しご","にじゅう"],["しろく","にじゅうし"],["ししち","にじゅうはち"],["しは","さんじゅうに"],["しく","さんじゅうろく"]],
 5:[["ごいちが","ご"],["ごに","じゅう"],["ごさん","じゅうご"],["ごし","にじゅう"],["ごご","にじゅうご"],["ごろく","さんじゅう"],["ごしち","さんじゅうご"],["ごは","しじゅう"],["ごっく","しじゅうご"]],
 6:[["ろくいちが","ろく"],["ろくに","じゅうに"],["ろくさん","じゅうはち"],["ろくし","にじゅうし"],["ろくご","さんじゅう"],["ろくろく","さんじゅうろく"],["ろくしち","しじゅうに"],["ろくは","しじゅうはち"],["ろっく","ごじゅうし"]],
 7:[["しちいちが","しち"],["しちに","じゅうし"],["しちさん","にじゅういち"],["しちし","にじゅうはち"],["しちご","さんじゅうご"],["しちろく","しじゅうに"],["しちしち","しじゅうく"],["しちは","ごじゅうろく"],["しちく","ろくじゅうさん"]],
 8:[["はちいちが","はち"],["はちに","じゅうろく"],["はちさん","にじゅうし"],["はちし","さんじゅうに"],["はちご","しじゅう"],["はちろく","しじゅうはち"],["はちしち","ごじゅうろく"],["はっぱ","ろくじゅうし"],["はっく","しちじゅうに"]],
 9:[["くいちが","く"],["くに","じゅうはち"],["くさん","にじゅうしち"],["くし","さんじゅうろく"],["くご","しじゅうご"],["くろく","ごじゅうし"],["くしち","ろくじゅうさん"],["くは","しちじゅうに"],["くく","はちじゅういち"]],
};
const ANS_YOMI = {}; for (const d in KUKU) KUKU[d].forEach(([,a],i)=>{ ANS_YOMI[d*(i+1)] ??= a; });
const PH = { dan1:"いちのだん",dan2:"にのだん",dan3:"さんのだん",dan4:"よんのだん",dan5:"ごのだん",dan6:"ろくのだん",dan7:"ななのだん",dan8:"はちのだん",dan9:"きゅうのだん",
  praise1:"すごーい！ せいかい！",praise2:"やったね！",praise3:"そのちょうし！",praise4:"かんぺき！",praise5:"てんさい！",
  oshii:"おしい！ もういっかい！",daijoubu:"だいじょうぶ。 いっしょに いってみよう。",issho:"いっしょに いってみよう！",tsuzuki:"つづきを いってね！",
  dore:"どれかな？",kiitene:"よーく きいてね。",clear:"ぜんぶ いえたね！ すごい！",nakama:"あたらしい なかまが ふえたよ！",start:"はじめるよ！",mouikkai:"もういっかい きく？" };
// 開放の順番（2と5からスタート）
const ORDER = [2,5,3,4,6,7,8,9,1];
const DAN_COLOR = {1:"#a0a4b8",2:"#ff6b5b",3:"#ffa53b",4:"#e6b800",5:"#47c97a",6:"#2ec4b6",7:"#4aa8ff",8:"#a77bff",9:"#ff7fb6"};
// なかま（ほしが STAR_PER たまるごとに1ぴき）
const STAR_PER = 8;
const FRIENDS = [
 ["🐣","ぴよすけ"],["🐸","けろまる"],["🐢","のんびりん"],["🦖","がおザウルス"],["🐙","たこっち"],["🐳","くじらん"],["🦀","かにかに"],["🐬","いるかん"],["🐠","ぴちぴち"],
 ["🦕","ながくびー"],["🐘","ぱおーん"],["🦒","きりりん"],["🦁","らいおー"],["🐯","とらきち"],["🐻","くまごろう"],["🐼","ぱんだっち"],["🐨","こあらん"],["🐵","もんきち"],
 ["🦉","ほーほー"],["🐧","ぺんた"],["🦩","ふらみん"],["🦔","はりりん"],["🦦","かわうっそ"],["🐿️","りすけ"],["🦄","ゆにこ"],["🐉","どらごん"],["🦋","ちょうちょ"],
 ["🐞","てんとん"],["🐝","ぶんぶん"],["🐌","でんでん"],["🦚","くじゃっく"],["🐓","こけっこ"],["🦘","ぴょんた"],["🐊","わにお"],["🦈","さめじろう"],["🦑","いかすけ"],
 ["🐲","りゅうくん"],["🦥","なまけん"],["🦓","しまうまん"],["🦜","いんこちゃん"],["🐋","おおくじら"],["🦅","わしまる"],["🦭","あざらっし"],["🐆","ひょうた"],["👾","くくモン"],
];

/* ============ 保存 ============ */
const KEY = "sora-kuku-v1";
let S = { stars:0, friends:0, unlocked:[2,5], stamps:{}, speed:1, order:0 };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const stamp = (d,m) => (S.stamps[d] ||= {}, S.stamps[d][m]);

/* ============ 音 ============ */
const AU = new Audio(); AU.preload = "auto";
let audioOK = true;        // mp3 が無いときは端末の読み上げに切りかえ
let actx = null;
const rnd = a => a[Math.floor(Math.random()*a.length)];
const voice = () => Math.random() < .5 ? "A" : "C";
const sleep = ms => new Promise(r => setTimeout(r, ms));
let RUN = 0;                // 画面を出たら古い再生を止める合図
const alive = id => id === RUN;

function speakTTS(text, v, rate){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return setTimeout(res, 600);
    const u = new SpeechSynthesisUtterance(text); u.lang = "ja-JP";
    u.rate = 1.1 * (rate||1); u.pitch = v === "C" ? .8 : 1.2;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 4000);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  });
}
// file: 例 "full_3x8"、text: 読み（予備用）
function play(file, text, v = voice(), rate = 1){
  if (!audioOK) return speakTTS(text, v, rate);
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; AU.onended = AU.onerror = null; res(); } };
    let fell = false; const fallback = () => { if (fell || done) return; fell = true; audioOK = false; speakTTS(text, v, rate).then(fin); };
    AU.onended = fin;
    AU.onerror = fallback;
    AU.src = `audio/${file}_${v}.mp3`;
    AU.playbackRate = rate; AU.preservesPitch = true;
    const p = AU.play(); if (p) p.catch(e => { if (e && e.name === "AbortError") return; fallback(); });
    setTimeout(fin, 8000);
  });
}
function stopAll(){ RUN++; try { AU.pause(); } catch(e) {} try { speechSynthesis.cancel(); } catch(e) {} }
const playPh = (id, v) => play("ph_"+id, PH[id], v);
const playFull = (d,b,v,r) => play(`full_${d}x${b}`, KUKU[d][b-1].join(" "), v, r);
const playCall = (d,b,v) => play(`call_${d}x${b}`, KUKU[d][b-1][0], v);
const playAns  = (n,v)   => play(`ans_${n}`, ANS_YOMI[n], v);

// こうかおん（WebAudio で作る）
function sfx(kind){
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const tone = (f, s, d, type="sine", g=.18) => {
      const o = actx.createOscillator(), a = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t+s);
      a.gain.setValueAtTime(0, t+s); a.gain.linearRampToValueAtTime(g, t+s+.01); a.gain.exponentialRampToValueAtTime(.001, t+s+d);
      o.connect(a).connect(actx.destination); o.start(t+s); o.stop(t+s+d+.05);
    };
    if (kind === "pon")  { tone(660,0,.12,"triangle",.15); }
    if (kind === "ok")   { tone(784,0,.12); tone(1047,.1,.25); }
    if (kind === "ng")   { tone(220,0,.25,"square",.06); }
    if (kind === "fan")  { [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,"triangle",.16)); }
    if (kind === "tick") { tone(1200,0,.04,"square",.04); }
  } catch(e) {}
}

/* ============ 画面 ============ */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
let DAN = 2;
function go(id){
  stopAll();
  $$(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  refreshStars();
  if (id === "home") renderHome();
  if (id === "danMenu") renderMenu();
  if (id === "zukanScr") renderZukan();
  if (id === "listen") startListen();
  if (id === "say") startSay();
  if (id === "pick") startPick();
}
$$("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
function refreshStars(){ $$(".starbox").forEach(e => e.textContent = "⭐ " + S.stars); }
function toast(t, ms=900){ const e = $("#toast"); e.textContent = t; e.classList.add("on"); setTimeout(()=>e.classList.remove("on"), ms); }

function renderHome(){
  const g = $("#dangrid"); g.innerHTML = "";
  ORDER.forEach(d => {
    const b = document.createElement("button");
    const open = S.unlocked.includes(d);
    b.className = "dan" + (open ? "" : " lock");
    b.style.background = DAN_COLOR[d];
    const st = ["listen","say","pick"].map(m => stamp(d,m) ? "⭐" : "・").join("");
    b.innerHTML = `<span class="n">${d}</span><span class="l">のだん</span><span class="st">${open ? st : ""}</span>`;
    b.onclick = () => {
      if (!open) { sfx("ng"); b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); return; }
      DAN = d; go("danMenu");
    };
    g.appendChild(b);
  });
}
function renderMenu(){
  $("#danTitle").textContent = DAN + "のだん";
  $("#danTitle").style.color = DAN_COLOR[DAN];
  $$("[data-done]").forEach(e => e.textContent = stamp(DAN, e.dataset.done) ? "⭐" : "");
  $$(".screen .ttl").forEach(e => { e.dataset.base ||= e.textContent; e.textContent = `${DAN}のだん ${e.dataset.base}`; });
  playPh("dan"+DAN);
}
$$(".mode").forEach(b => b.onclick = () => go(b.dataset.mode));
$("#toZukan").onclick = () => go("zukanScr");

// ほし・スタンプ・なかま
function addStars(n){
  S.stars += n; refreshStars();
  const should = Math.min(FRIENDS.length, Math.floor(S.stars / STAR_PER));
  let newF = null;
  if (should > S.friends) { S.friends = should; newF = FRIENDS[should-1]; }
  save();
  return newF;
}
function finishMode(mode){
  let first = false;
  if (!stamp(DAN, mode)) { S.stamps[DAN][mode] = 1; first = true; }
  // 3つそろったら次のだんを開ける
  let opened = null;
  if (["listen","say","pick"].every(m => stamp(DAN,m))) {
    const next = ORDER.find(d => !S.unlocked.includes(d));
    if (next) { S.unlocked.push(next); opened = next; }
  }
  save();
  return { first, opened };
}
function showModal(face, h, p){
  return new Promise(res => {
    $("#modal .face").textContent = face; $("#modal h3").textContent = h; $("#modal p").textContent = p;
    $("#modal").classList.add("on"); sfx("fan");
    $("#modalOk").onclick = () => { $("#modal").classList.remove("on"); res(); };
  });
}
async function celebrate(newF, fin){
  if (fin && fin.first) await showModal("⭐", "スタンプ ゲット！", `${DAN}のだんの スタンプが ふえたよ`);
  if (newF) { playPh("nakama"); await showModal(newF[0], newF[1], "あたらしい なかまが ふえたよ！"); }
  if (fin && fin.opened) await showModal("🔓", `${fin.opened}のだん`, `${fin.opened}のだんが あそべるように なったよ！`);
}

function renderProg(scr, n, cur, okSet){
  const p = $(".prog", scr); p.innerHTML = "";
  for (let i=1;i<=n;i++){ const e = document.createElement("i"); e.textContent = i; if (okSet && okSet.has(i)) e.className="ok"; if (i===cur) e.className="now"; p.appendChild(e); }
}
function setEq(scr, f, y, popIt){
  const eq = $(".eq", scr); $(".f", eq).innerHTML = f; $(".y", eq).textContent = y || " ";
  if (popIt) { eq.classList.remove("pop"); void eq.offsetWidth; eq.classList.add("pop"); }
}

/* ---- きく ---- */
const SPEEDS = [ {rate:.85, gap:900}, {rate:1, gap:550}, {rate:1.15, gap:250} ];
$$("#speedSeg button").forEach(b => b.onclick = () => {
  S.speed = +b.dataset.sp; save();
  $$("#speedSeg button").forEach(x => x.classList.toggle("on", x===b));
});
$("#listenPlay").onclick = () => startListen();
async function startListen(){
  stopAll(); const id = RUN; const scr = $("#listen");
  $$("#speedSeg button").forEach(x => x.classList.toggle("on", +x.dataset.sp === S.speed));
  const v = voice();
  setEq(scr, `${DAN}のだん`, "よーく きいてね", true); renderProg(scr, 9, 0);
  await playPh("kiitene", v); if (!alive(id)) return;
  await sleep(400);
  const ok = new Set();
  for (let b=1;b<=9;b++){
    if (!alive(id)) return;
    const sp = SPEEDS[S.speed];
    renderProg(scr, 9, b, ok);
    setEq(scr, `${DAN} × ${b} = ${DAN*b}`, KUKU[DAN][b-1].join(" "), true);
    sfx("pon"); await sleep(120);
    await playFull(DAN, b, v, sp.rate); if (!alive(id)) return;
    ok.add(b); await sleep(sp.gap);
  }
  renderProg(scr, 9, 0, ok);
  setEq(scr, "🎉", "ぜんぶ きけたね！", true);
  const newF = addStars(1); const fin = finishMode("listen");
  await celebrate(newF, fin);
}

/* ---- こたえて ---- */
$$("#orderSeg button").forEach(b => b.onclick = () => {
  S.order = +b.dataset.ord; save();
  $$("#orderSeg button").forEach(x => x.classList.toggle("on", x===b));
  startSay();
});
async function waitBar(scr, ms, id){
  const bar = $(".wait div", scr); const t0 = performance.now();
  while (performance.now() - t0 < ms) {
    if (!alive(id)) return;
    bar.style.width = (100 * (performance.now()-t0) / ms) + "%";
    await sleep(40);
  }
  bar.style.width = "100%";
}
async function startSay(){
  stopAll(); const id = RUN; const scr = $("#say");
  $$("#orderSeg button").forEach(x => x.classList.toggle("on", +x.dataset.ord === S.order));
  let list = [1,2,3,4,5,6,7,8,9];
  if (S.order === 1) list.sort(() => Math.random() - .5);
  const ok = new Set();
  renderProg(scr, 9, 0); setEq(scr, `${DAN}のだん`, "つづきを いってね！", true);
  $(".hint", scr).textContent = ""; $(".wait div", scr).style.width = "0";
  await playPh("tsuzuki"); if (!alive(id)) return; await sleep(500);
  for (const b of list){
    if (!alive(id)) return;
    const v = voice(), n = DAN*b;
    renderProg(scr, 9, b, ok);
    setEq(scr, `${DAN} × ${b} = <span class="q">？</span>`, KUKU[DAN][b-1][0] + " …", true);
    $(".hint", scr).textContent = ""; $(".wait div", scr).style.width = "0";
    await playCall(DAN, b, v); if (!alive(id)) return;
    $(".hint", scr).textContent = "📣 いってみよう！";
    await waitBar(scr, S.order ? 3000 : 2400, id); if (!alive(id)) return;
    setEq(scr, `${DAN} × ${b} = <span class="q">${n}</span>`, KUKU[DAN][b-1].join(" "), true);
    $(".hint", scr).textContent = "";
    sfx("ok"); await playAns(n, v); if (!alive(id)) return;
    ok.add(b); renderProg(scr, 9, 0, ok);
    await sleep(600);
  }
  setEq(scr, "🎉", "ぜんぶ いえたね！", true);
  await playPh("clear"); if (!alive(id)) return;
  const newF = addStars(3); const fin = finishMode("say");
  await celebrate(newF, fin);
}

/* ---- どれかな ---- */
const FACES = ["🐣","🦖","🐙","🐸","🐻","🐧","🐼","🦁","🐳"];
let pickCur = null;
$("#pickReplay").onclick = () => { if (pickCur) pickCur.replay(); };
function wrongNums(n){
  // まちがいの こたえ：同じだんの となり・ほかのだんの ちかい数
  const pool = new Set();
  for (const k of [-2,-1,1,2]) { const x = n + DAN*k; if (x>0 && x<=81 && ANS_YOMI[x]) pool.add(x); }
  for (const k of [-3,-2,-1,1,2,3]) { const x = n + k; if (x>0 && ANS_YOMI[x]) pool.add(x); }
  pool.delete(n);
  return [...pool].sort(() => Math.random()-.5).slice(0,2);
}
async function startPick(){
  stopAll(); const id = RUN; const scr = $("#pick");
  const list = [1,2,3,4,5,6,7,8,9].sort(() => Math.random()-.5);
  const ok = new Set(); let miss = 0; const f0 = S.friends;
  renderProg(scr, 9, 0);
  for (let qi=0; qi<list.length; qi++){
    const b = list[qi], n = DAN*b, v = voice();
    renderProg(scr, 9, qi+1, ok);
    const opts = [n, ...wrongNums(n)].sort(() => Math.random()-.5);
    const faces = [...FACES].sort(() => Math.random()-.5).slice(0,3);
    const vs = ["A","C", Math.random()<.5?"A":"C"].sort(() => Math.random()-.5);
    const box = $(".choices", scr); box.innerHTML = "";
    const btns = opts.map((x,i) => {
      const e = document.createElement("button"); e.className = "choice";
      e.innerHTML = `<span class="face">${faces[i]}</span><span class="num">${x}</span>`;
      box.appendChild(e); return e;
    });
    setEq(scr, `${DAN} × ${b} = <span class="q">？</span>`, KUKU[DAN][b-1][0] + " …", true);
    $(".hint", scr).textContent = "";
    let locked = true;
    const intro = async () => {
      locked = true;
      await playCall(DAN, b, v); if (!alive(id)) return;
      await sleep(250);
      for (let i=0;i<3;i++){
        if (!alive(id)) return;
        btns[i].classList.add("speak");
        await playAns(opts[i], vs[i]);
        btns[i].classList.remove("speak");
        await sleep(150);
      }
      $(".hint", scr).textContent = "👆 ただしい こを タッチ！";
      locked = false;
    };
    pickCur = { replay: () => { if (!locked) intro(); } };
    const answered = new Promise(res => {
      btns.forEach((e,i) => e.onclick = async () => {
        if (locked) return;
        if (opts[i] === n) {
          locked = true; e.classList.add("right"); sfx("ok"); $(".hint", scr).textContent = "⭕ せいかい！";
          btns.forEach(x => { if (x!==e) x.classList.add("wrong"); });
          setEq(scr, `${DAN} × ${b} = <span class="q">${n}</span>`, KUKU[DAN][b-1].join(" "), true);
          await playFull(DAN, b, v); if (!alive(id)) return;
          await playPh(rnd(["praise1","praise2","praise3","praise4","praise5"]));
          res(true);
        } else {
          miss++; sfx("ng"); e.classList.add("shake","wrong");
          setTimeout(()=>e.classList.remove("shake"),400);
          locked = true; await playPh("oshii"); locked = false;
        }
      });
    });
    await intro(); if (!alive(id)) return;
    await answered; if (!alive(id)) return;
    ok.add(qi+1); addStars(1);
    renderProg(scr, 9, 0, ok);
    await sleep(500);
  }
  pickCur = null;
  setEq(scr, "🎉", "ぜんぶ せいかい！", true); $(".choices", scr).innerHTML = ""; $(".hint", scr).textContent = "";
  await playPh("clear"); if (!alive(id)) return;
  addStars(miss === 0 ? 3 : 1);
  const fin = finishMode("pick");
  await celebrate(S.friends > f0 ? FRIENDS[S.friends-1] : null, fin);
}

/* ---- なかま ---- */
function renderZukan(){
  const rest = STAR_PER - (S.stars % STAR_PER);
  const pct = 100 * (S.stars % STAR_PER) / STAR_PER;
  $("#meter").innerHTML = S.friends >= FRIENDS.length
    ? "ぜんいん なかまに なったよ！ 🎉"
    : `つぎの なかままで あと ⭐${rest}<div class="bar"><div style="width:${pct}%"></div></div>`;
  $("#zukan").innerHTML = FRIENDS.map((f,i) => i < S.friends
    ? `<div><span>${f[0]}</span>${f[1]}</div>` : `<div class="no"><span>${f[0]}</span>？？？</div>`).join("");
}
